<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="$theme_paper">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$url">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$url">
  <meta property="og:image" content="$portrait_url">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/hanken-grotesk-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <style>:root { $theme_variables }</style>
  <script type="application/ld+json">$structured_data</script>
  <script src="assets/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="#main" aria-label="$name home">$name<span class="wordmark-dot">.</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>Menu <span aria-hidden="true">＋</span></button>
      <nav id="site-nav" class="site-nav" aria-label="Main navigation">$navigation</nav>
    </div>
  </header>
  <main id="main">$sections</main>
  <footer class="site-footer">
    <div class="container footer-inner"><span>© $year $name</span><span>Computer vision research</span><a href="#main">Back to top</a></div>
  </footer>
</body>
</html>
