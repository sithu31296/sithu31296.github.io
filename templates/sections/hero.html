<section class="hero" id="hero" aria-labelledby="hero-title">
  <div class="container hero-grid">
    <div class="hero-copy">
      $hero_badge
      <h1 id="hero-title">$first_line <span class="name-highlight">$second_line</span></h1>
      <p class="hero-tagline">$tagline</p>
      <p class="hero-description">$hero_description</p>
      <div class="hero-actions">$hero_primary<a class="button button-secondary" href="$hero_contact_url">Get in touch</a></div>
    </div>
    <figure class="$portrait_art_class">
      $hero_artwork
      <div class="portrait-frame">
        <img src="$portrait" alt="$name" width="803" height="665" fetchpriority="high">
      </div>
    </figure>
  </div>
</section>
