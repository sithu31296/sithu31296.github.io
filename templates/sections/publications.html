<section
  id="publications"
  class="section publications-section"
  aria-labelledby="publications-title"
>
  <div class="container">
    <div class="section-heading">
      <div>
        <h2 id="publications-title">$heading</h2>
        <p class="section-description">$section_description</p>
      </div>
      <span class="count-tag">$paper_count PAPERS</span>
    </div>
    <!-- $filters -->
    <p class="publication-note">* denotes equal contribution.</p>
    <div class="publications-grid">$publication_cards</div>
    <p class="filter-status" role="status" aria-live="polite" hidden></p>
    <div class="empty-state" hidden>
      <h3>No matching publications.</h3>
      <p>Try another search or year.</p>
      <button class="button" type="button" data-reset-filters>
        Reset filters
      </button>
    </div>
    <a class="button button-secondary scholar-link" href="$scholar_url"
      >View Google Scholar</a
    >
  </div>
</section>
